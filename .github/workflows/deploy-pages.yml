name: Build and deploy to GitHub Pages

# Job 2 of 2. Builds dist/ from the committed data/library.json and publishes
# it. Runs on any push to main — including the data commit made by
# fetch-airtable.yml, which is what ties a data change to a redeploy.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/build.js'
      - '.github/workflows/deploy-pages.yml'

  # Lets you redeploy without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a data commit is
# always eventually published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: node scripts/build.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
