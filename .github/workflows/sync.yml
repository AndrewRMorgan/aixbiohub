name: Sync Zotero to Airtable

on:
  schedule:
    # Daily at 00:35 UTC. The Zotero library changes at most a few times a week,
    # so twice a day only bought duplicate work. Off the hour on purpose:
    # GitHub delays scheduled runs that pile up on the hour mark.
    - cron: '35 0 * * *'
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Run sync script
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: node sync-zotero-to-airtable.js