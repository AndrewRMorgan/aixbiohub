name: Fetch Airtable data

# Job 1 of 2. Pulls Airtable into data/library.json and commits it ONLY if the
# content actually changed, then explicitly dispatches deploy-pages.yml so the
# site rebuilds when the data moves — not on a timer of its own.
#
# The dispatch is not redundant with deploy-pages.yml's `on: push`. See the
# comment on the trigger step below.

on:
  schedule:
    # Daily at 05:15 UTC. Off the hour on purpose: GitHub delays scheduled runs
    # that pile up on the hour mark.
    - cron: '15 5 * * *'

  # Lets you pull fresh data on demand from the Actions tab.
  workflow_dispatch:

# contents: write for the commit below; actions: write to dispatch the deploy.
permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-airtable
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Airtable into data/library.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/fetch-airtable.js

      - name: Commit only if the data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/library.json

          # --cached compares the index against HEAD, so this is also correct
          # the very first time the file is added. Exit 0 means nothing staged.
          if git diff --cached --quiet; then
            echo "data/library.json unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed lines:"
          git diff --cached --stat

          git commit -m "Update Airtable data"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN does NOT start another
      # workflow run: GitHub blocks that to stop workflows retriggering
      # themselves. So deploy-pages.yml's `on: push` never sees the commit
      # above, and the site keeps serving stale data until somebody pushes by
      # hand — which is exactly how 226 freshly tagged records sat unpublished.
      #
      # workflow_dispatch is a documented exception to that rule, so asking for
      # the deploy explicitly is what actually ties a data change to a redeploy.
      # Gating on the step output keeps the "only deploy when the data moved"
      # property: a no-change day dispatches nothing.
      - name: Trigger the Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
          echo "Dispatched deploy-pages.yml on $GITHUB_REF_NAME."
